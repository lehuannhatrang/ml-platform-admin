apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata:
  name: kueue-workloadpriorityclass-crd-propagation
  labels:
    app.kubernetes.io/name: kueue-crd-propagation
    app.kubernetes.io/component: priority-management
spec:
  resourceSelectors:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: workloadpriorityclasses.kueue.x-k8s.io
  placement:
    clusterAffinity:
      clusterNames: []  # Empty means propagate to all clusters

