apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - admin-sa.yaml
  - etcd-pv.yaml
  - admin-etcd.yaml
  - admin-configmap.yaml
  - admin-web.yaml
  - admin-api.yaml

# Configuration for secrets that can be created at deploy time
secretGenerator:
  # Secret for dashboard admin user
  - name: ml-platform-admin-inital-password
    type: Opaque
    literals:
      - password=admin123  # Default password, should be changed in production

  # Secret for JWT token signing
  - name: ml-platform-admin-jwt
    type: Opaque
    literals:
      - secret=ml-platform-admin-secret-key-change-me-in-production

patches:
  - target:
      kind: Service
      name: ml-platform-admin-web
      namespace: ml-platform-system
      version: v1
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 32000  # you can change the nodePort value
  - target:
      kind: Deployment
      name: ml-platform-admin-api
      namespace: ml-platform-system
      version: v1
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FRONTEND_URL
          value: http://192.168.40.245:32000
